name: build site
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_site.py, roblox_api.py, cloud/build_cloud.py, collector.py, games.txt]
permissions:
  contents: write
concurrency:
  group: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site from collected data
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone --branch data --single-branch "$REPO_URL" datarepo
          python3 cloud/build_cloud.py datarepo
          rm -rf datarepo data.db
      # Prints a report about the pages that were just built: broken links, missing
      # titles, two pages sharing a description, and so on. It never stops the build,
      # because an out-of-date site is worse than an imperfect one. Read the report in
      # this job's log if search traffic ever looks wrong.
      - name: Check the built pages for search-engine mistakes
        run: python3 check_seo.py docs || true
      # main can move while this job is running - someone pushing a second commit
      # right after the one that triggered the build, say - and a plain `git push` is
      # then rejected as not-a-fast-forward. The site had already been built and
      # checked by that point, so the whole thing failed at the last step and the
      # pages were thrown away. That is how NOINDEX = False built cleanly on 14 Nov
      # 2026 and never reached anybody.
      #
      # Rebasing is always safe here: this job only ever touches docs/ and the two
      # generated worker files, and nobody edits those by hand. The retry covers main
      # moving again while we were rebasing.
      - name: Commit the site
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@users.noreply.github.com"
          git add -A docs worker/stats.js worker/theme.js   # -A so pages build_site.py pruned are staged as deletions
          git commit -m "rebuild site" || exit 0
          for try in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "could not rebase onto main"; exit 1; }
            git push && exit 0
            echo "push rejected because main moved again - retrying ($try of 3)"
            sleep 5
          done
          echo "gave up after 3 tries"
          exit 1
