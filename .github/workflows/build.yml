name: build site
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_site.py, roblox_api.py, cloud/build_cloud.py, collector.py, games.txt]
permissions:
  contents: write
concurrency:
  group: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site from collected data
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone --branch data --single-branch "$REPO_URL" datarepo
          python3 cloud/build_cloud.py datarepo
          rm -rf datarepo data.db
      # Prints a report about the pages that were just built: broken links, missing
      # titles, two pages sharing a description, and so on. It never stops the build,
      # because an out-of-date site is worse than an imperfect one. Read the report in
      # this job's log if search traffic ever looks wrong.
      - name: Check the built pages for search-engine mistakes
        run: python3 check_seo.py docs || true
      # main moves while this job runs - another session pushing, or the collector -
      # and the site is already built and checked by the time we get here, so anything
      # that fails at this step throws a perfectly good site away and leaves the live
      # one stale with nothing to show for it. That happened twice on 14 Nov 2026:
      # first a plain `git push` rejected as not-a-fast-forward, then a `git rebase`
      # that could not replay the commit either (the checkout is shallow, and both
      # sides touch docs/).
      #
      # So do not replay anything. The working tree already holds exactly the files
      # this build produced; point the index at whatever main is now and stage them on
      # top. That cannot conflict, whatever anyone else pushed while we were building.
      # Only docs/ and the two generated worker files are staged, so a source change
      # someone else pushed is left exactly as they pushed it.
      - name: Commit the site
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A docs worker/stats.js worker/theme.js   # -A so pages build_site.py pruned are staged as deletions
            git commit -m "rebuild site" || exit 0
            git push && exit 0
            echo "push rejected because main moved again - retrying ($try of 3)"
            sleep 5
          done
          echo "gave up after 3 tries"
          exit 1
